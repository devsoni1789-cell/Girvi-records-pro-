name: Build Android APK

# Runs automatically whenever you push a change to the main branch,
# and can also be started manually from the Actions tab (the
# "Run workflow" button) if you ever need to rebuild without changing
# anything.
"on":
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Needed so this workflow is allowed to create/update a GitHub Release
# with the built APK attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          echo "Licenses already accepted or handled automatically â€” continuing"

      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@latest \
            @capacitor/cli@latest \
            @capacitor/android@latest \
            @capacitor/app@latest \
            @capacitor/filesystem@latest \
            @capacitor/share@latest \
            @capacitor/assets@latest

      - name: Create native Android project
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npx @capacitor/assets generate --android

      - name: Copy web app into the native project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for download
        run: |
          mkdir -p output
          BUILD_DATE=$(date +'%Y-%m-%d')
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/SwarnaLedger-${BUILD_DATE}.apk"
          echo "Built: output/SwarnaLedger-${BUILD_DATE}.apk"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarnaLedger-APK
          path: output/*.apk
          retention-days: 90

      - name: Publish APK to the "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Swarna Ledger â€” Latest build"
          body: |
            Automatically built from the latest code in this repository.

            **To install:** tap the .apk file below, download it, open it,
            then tap Install (you may need to allow "Install unknown apps"
            for your browser the first time â€” Android will prompt you).
          files: output/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
